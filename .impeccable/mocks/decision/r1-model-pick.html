<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#2b2b2b;font-family:'Libre Franklin',sans-serif;color:#1a1a1a}
.sheet{margin:12px;background:#f6f1e6;padding:14px 16px;border-top:6px dotted #2b2b2b}
.m{display:flex;justify-content:space-between;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#c8281e}
.n{font-size:120px;font-weight:900;color:#c8281e;line-height:.9;text-align:center;margin-top:4px}
.dn{text-align:center;font-size:20px;font-weight:700;color:#c8281e}
.im{text-align:center;font-size:14px;margin-top:6px}
.sun{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:#555;border-top:1px solid #d8d0bd;padding-top:6px}
.list{margin:0 12px;background:#f6f1e6}
.li{display:grid;grid-template-columns:110px 1fr;padding:12px 16px;border-bottom:1px solid #d8d0bd;gap:8px}
.li b{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#2c4a7a}
.li span{font-size:16px;font-weight:700}
.tabs{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#1a1a1a;color:#f6f1e6}
.tabs div{padding:10px 0 18px;text-align:center;font-size:13px}.tabs .on{font-weight:900}
</style></head><body>
<div class="sheet"><div class="m"><span>Październik 2026</span><span>Żabiny ▾</span></div>
 <div class="n">11</div><div class="dn">Niedziela</div><div class="im">Imieniny: Aldony, Emila, Brunona</div>
 <div class="sun"><span>wsch. 7:04</span><span>9° · zachmurzenie</span><span>zach. 18:01</span></div></div>
<div class="list">
 <div class="li"><b>Prąd</b><span>W Żabinach bez wyłączeń · gmina: wt 14.10 Grądy</span></div>
 <div class="li"><b>Wywóz</b><span>wtorek 13.10 · zmieszane</span></div>
 <div class="li"><b>Autobus</b><span>jutro 06:40 do Działdowa</span></div>
</div>
<nav class="tabs"><div class="on">Dziś</div><div>Gmina</div><div>Zapytaj</div><div>Więcej</div></nav>
</body></html>
