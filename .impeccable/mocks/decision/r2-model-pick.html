<!doctype html>

<style>
*{box-sizing:border-box;margin:0;padding:0}

.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px}
.w{background:#1a1f2b;border-radius:22px;padding:14px;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between}
.w .k{font-size:13px;color:#9aa3b5;font-weight:600}
.w .n{font-size:40px;font-weight:800;letter-spacing:-.03em}
.w .s{font-size:14px}
.btn{margin:14px 12px;background:#5ea0ff;color:#0a0c12;border-radius:16px;text-align:center;padding:15px;font-weight:700;font-size:17px}
.tabs{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs div{padding:10px 0 18px;text-align:center;font-size:13px;color:#9aa3b5}.tabs .on{color:#5ea0ff;font-weight:700}
