<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#0e1a24;color:#0e1a24;font-family:'Schibsted Grotesk',sans-serif}
.top{display:flex;justify-content:space-between;padding:12px 16px;color:#f5f1e4;font-weight:800;font-size:18px}
.top span{font-weight:500;font-size:14px}
.lobe{margin:8px 0 0 -20px;width:430px;background:#8ed462;border-radius:0 46% 54% 0/0 30% 70% 0;padding:24px 40px 40px 36px}
.lobe h1{font-size:44px;line-height:.95;letter-spacing:-.04em}
.lobe p{font-size:15px;margin-top:4px;font-weight:500}
.caps{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.cap{display:flex;justify-content:space-between;align-items:center;border-radius:999px;padding:10px 16px;font-weight:800;font-size:16px}
.cap small{font-weight:500;font-size:13px;display:block}
.y{background:#f5e211}.b{background:#2ba0ff}.c{background:#ff705d}.w{background:#f5f1e4}
.lake{color:#2ba0ff;padding:18px 16px 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.tabs{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);color:#f5f1e4}
.tabs div{padding:10px 0 18px;text-align:center;font-size:13px}.tabs .on{font-weight:800}
</style></head><body>
<div class="top">RybnoLive<span>niedz. 11.10 · 9°</span></div>
<div class="lobe"><h1>Żabiny</h1><p>zmień wieś na mapie gminy</p>
 <div class="caps">
  <div class="cap w"><span>Prąd i woda<small>bez wyłączeń · gmina: wt Grądy</small></span>●</div>
  <div class="cap y"><span>Wywóz<small>wtorek 13.10 · zmieszane</small></span>●</div>
  <div class="cap b"><span>Autobus<small>jutro 06:40 do Działdowa</small></span>●</div>
  <div class="cap c"><span>Powiadamiaj o Żabinach</span>→</div>
 </div></div>
<div class="lake">Jezioro Rybno ·  Zarybinek · Hartowiec</div>
<nav class="tabs"><div class="on">Mapa</div><div>Gmina</div><div>Zapytaj</div><div>Więcej</div></nav>
</body></html>
