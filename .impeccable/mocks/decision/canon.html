<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#eef2f7;color:#0f1b33;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
.top{background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbe2ec}
.top b{font-size:18px}.top span{font-size:14px;color:#0a58ca;font-weight:600}
.hi{padding:16px}.hi h1{font-size:24px}.hi p{font-size:15px;color:#4a5872;margin-top:2px}
.card{background:#fff;margin:0 16px 12px;border-radius:14px;padding:14px;border:1px solid #dbe2ec}
.card.al{border-left:4px solid #d93025}
.k{font-size:13px;color:#4a5872;font-weight:600}.v{font-size:19px;font-weight:700;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px 12px}
.grid .card{margin:0}
.btn{margin:4px 16px;background:#0a58ca;color:#fff;text-align:center;border-radius:12px;padding:14px;font-weight:700}
.tabs{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dbe2ec;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs div{padding:10px 0 18px;text-align:center;font-size:13px;color:#4a5872}.tabs .on{color:#0a58ca;font-weight:700}
</style></head><body>
<div class="top"><b>RybnoLive</b><span>Zaloguj</span></div>
<div class="hi"><h1>Dzień dobry, Żabiny</h1><p>niedziela, 11 października · 9°</p></div>
<div class="card al"><div class="k">Prąd i woda</div><div class="v">Wt 14.10 9:00–13:00 wyłączenie — Grądy</div></div>
<div class="grid">
 <div class="card"><div class="k">Wywóz</div><div class="v">wt 13.10</div></div>
 <div class="card"><div class="k">Autobus</div><div class="v">jutro 06:40</div></div>
 <div class="card"><div class="k">Pogoda</div><div class="v">9°</div></div>
 <div class="card"><div class="k">Dziś w gminie</div><div class="v">spokojnie</div></div>
</div>
<div class="btn">Włącz powiadomienia</div>
<nav class="tabs"><div class="on">Start</div><div>Gmina</div><div>Asystent</div><div>Więcej</div></nav>
</body></html>
