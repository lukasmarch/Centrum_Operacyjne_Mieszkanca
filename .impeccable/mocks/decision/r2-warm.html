<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#f6f1ea;color:#1d1b19;font-family:'Nunito Sans',sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.top b{font-size:18px;font-weight:800}.top span{font-size:14px;background:#fff;border-radius:999px;padding:6px 12px}
.hi{padding:4px 18px 14px}.hi h1{font-size:30px;font-weight:800;line-height:1.1}.hi p{color:#6b645c;font-size:15px;margin-top:4px}
.c{background:#fff;border-radius:22px;margin:0 14px 10px;padding:16px 18px}
.c .k{font-size:14px;color:#6b645c;font-weight:700}.c .v{font-size:21px;font-weight:800;margin-top:2px}.c .s{font-size:15px;color:#4a443e;margin-top:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 10px}.row .c{margin:0}
.btn{margin:6px 14px;background:#ff5b2e;color:#fff;border-radius:18px;text-align:center;padding:16px;font-weight:800;font-size:17px}
.tabs{position:absolute;bottom:0;left:0;right:0;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);border-radius:22px 22px 0 0}
.tabs div{padding:12px 0 20px;text-align:center;font-size:13px;color:#6b645c}.tabs .on{color:#ff5b2e;font-weight:800}
</style></head><body>
<div class="top"><b>RybnoLive</b><span>Żabiny ▾</span></div>
<div class="hi"><h1>Dzień dobry,<br>u Ciebie spokojnie</h1><p>niedziela 11.10 · 9°, pochmurno</p></div>
<div class="c"><div class="k">Prąd i woda</div><div class="v">W Żabinach bez wyłączeń</div><div class="s">W gminie: wt 14.10 9:00–13:00, Grądy</div></div>
<div class="row"><div class="c"><div class="k">Wywóz</div><div class="v">wt 13.10</div><div class="s">zmieszane</div></div><div class="c"><div class="k">Autobus</div><div class="v">jutro 6:40</div><div class="s">do Działdowa</div></div></div>
<div class="btn">Daj mi znać o awariach</div>
<nav class="tabs"><div class="on">Dziś</div><div>Gmina</div><div>Zapytaj</div><div>Więcej</div></nav>
</body></html>
