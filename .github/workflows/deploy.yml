name: Deploy Backend

# ⚠️ Zielony job NIE był dowodem wdrożenia (2 i 3.09.2026): `git pull` padał
# (GitHub limituje anonimowe pobrania z IP serwera), a skrypt bez `set -e` szedł
# dalej — budował obraz ze STAREGO kodu z warstw cache, health check drukował
# „Health OK" i job kończył się sukcesem. Dziś: serwer ciągnie repo kluczem
# deploy (read-only, `core.sshCommand` w repo), skrypt przerywa na pierwszym
# błędzie, a po pullu porównuje SHA z tym, który wywołał workflow.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy.yml'

jobs:
  # Bramka przed deployem (audyt 11.10.2026, F-031). Do tej pory push szedł na
  # produkcję bez uruchomienia ANI JEDNEGO testu — strażnik nagłówka briefingu
  # był zepsuty od 9.10 i nikt się o tym nie dowiedział.
  # Tylko testy bez bazy i bez modelu (te z bazą: job `db-tests` niżej — schemat budowany
  # NIE z modeli, tylko ze zrzutu produkcji, audyt E5). Sekrety poniżej to
  # atrapy wymaganych pól konfiguracji — żaden test nie może dzięki nim wyjść
  # do sieci (OpenAI odpowie 401, baza na porcie 1 odmówi połączenia).
  # Nowy test bez bazy i modelu → dopisz go do listy.
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/brak
      OPENAI_API_KEY: sk-ci-atrapa
      OPENWEATHER_API_KEY: ci-atrapa
      JWT_SECRET: ci-atrapa-ci-atrapa-ci-atrapa-ci-atrapa
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Testy bez bazy i modelu
        run: |
          set -u
          failed=""
          for t in \
            test_access_control:--no-db \
            test_agent_tools test_alert_policy test_bip_knowledge test_content_gate \
            test_content_score test_council_sessions test_council_store test_council_summary \
            test_event_dedup test_event_gate test_event_phase test_event_terms test_feed_dedup test_feed_window \
            test_gmina_facts test_grounding test_job_runs test_legal_acts test_migration_registry test_newsletter_tense test_outage_outlook test_password_reset \
            test_provenance test_road_context test_schema_contract test_source_health test_storm_policy test_story_judge test_summary_context \
            test_summary_headline test_text_clean test_timezone_guard
          do
            name="${t%%:*}"; args=""; [ "$name" != "$t" ] && args="${t#*:}"
            echo "::group::$name $args"
            if python -u -m "scripts.$name" $args </dev/null; then echo "OK $name"; else failed="$failed $name"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Czerwone:$failed"; exit 1; fi

  # Testy z bazą (audyt 11.10.2026, E5). Do tej pory CI nie uruchamiał ANI JEDNEGO testu z bazą:
  # `create_all` buduje inną bazę niż produkcja (modele znają 42 z 53 tabel; brak wektorów, triggera
  # tsvector, indeksu HNSW), więc regresje w SQL-u wychodziły dopiero na produkcji.
  # Schemat pochodzi ze zrzutu PRODUKCJI (`backend/scripts/schema/prod_schema.sql`, generowany
  # `scripts/db_schema_refresh.sh`), dane startowe z `seed.sql` (minimum, bez danych osobowych).
  # Baza żyje tylko w tym jobie (usługa na 127.0.0.1) — produkcji nie widzi, a klucze są atrapami.
  # Lista = testy, które SAME zakładają swoje dane i je sprzątają. Poza nią zostają testy mierzące
  # stan prawdziwej bazy (--db w feed_dedup, summary_context…), zależne od roku (test_waste_reminder)
  # i od rejestru CEIDG (dane osobowe). Nowy test z bazą → dopisz tu; nowy wiersz startowy → seed.sql.
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: centrum_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d centrum_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/centrum_ci
      OPENAI_API_KEY: sk-ci-atrapa
      OPENWEATHER_API_KEY: ci-atrapa
      JWT_SECRET: ci-atrapa-ci-atrapa-ci-atrapa-ci-atrapa
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Schemat produkcji i dane startowe
        run: |
          psql "postgresql://ci:ci@127.0.0.1:5432/centrum_ci" -v ON_ERROR_STOP=1 -q \
            -f scripts/schema/prod_schema.sql -f scripts/schema/seed.sql
      - name: Rejestr migracji (baseline, potem check — baza ze zrzutu ma być kompletna)
        run: |
          python -m scripts.migrate --baseline --yes
          python -m scripts.migrate --check
      - name: Testy z bazą
        run: |
          set -u
          failed=""
          for t in \
            test_job_runs:--db test_p24_ipn test_auth test_trial_lifecycle \
            test_batch_resilience test_privacy_retention test_solectwa
          do
            name="${t%%:*}"; args=""; [ "$name" != "$t" ] && args="${t#*:}"
            echo "::group::$name $args"
            if python -u -m "scripts.$name" $args </dev/null; then echo "OK $name"; else failed="$failed $name"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Czerwone:$failed"; exit 1; fi

  deploy:
    needs: [tests, db-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/centrum

            git fetch origin main
            git merge --ff-only origin/main
            DEPLOYED="$(git rev-parse HEAD)"
            if [ "$DEPLOYED" != "${{ github.sha }}" ]; then
              echo "::error::Po pullu HEAD=$DEPLOYED, a workflow wywołał ${{ github.sha }} — repo na serwerze nie nadążyło"
              exit 1
            fi
            echo "Kod na serwerze: $DEPLOYED"

            docker compose -f docker-compose.prod.yml build backend

            # Bramka migracji (audyt 11.10.2026, E5). „Migracja idzie na produkcję PRZED kodem" była
            # pilnowana pamięcią; kod bez kolumny to 500 na każdym zapytaniu, a job świecił na zielono.
            # Nowy obraz (jeszcze nie uruchomiony) sprawdza, czy baza ma wszystkie migracje schematu
            # z jego manifestu. Czeka niewykonana → deploy staje, STARY kontener działa dalej.
            # -T: ssh-action nie ma TTY; --no-deps: baza już stoi. Wynik nie zmienia niczego w bazie.
            if ! docker compose -f docker-compose.prod.yml run --rm -T --no-deps backend python -m scripts.migrate --check; then
              echo "::error::Baza produkcyjna nie ma migracji, których wymaga ten kod — deploy wstrzymany, działa poprzednia wersja."
              echo "Wykonaj je NOWYM obrazem (już zbudowany), potem ponów job (Re-run):"
              echo "  cd /opt/centrum && docker compose -f docker-compose.prod.yml run --rm -T --no-deps backend python -m scripts.migrate --apply --yes"
              echo "  bash scripts/db_schema_refresh.sh   # zrzut schematu do repo, commit"
              exit 1
            fi

            # Osierocony kontener po nieudanym `up` blokuje nazwę (3.09.2026,
            # dwa razy): sprzątamy zatrzymane, zanim postawimy nowy.
            docker ps -aq -f name=centrum-backend -f status=exited | xargs -r docker rm -f
            docker compose -f docker-compose.prod.yml up -d backend

            # Zdrowie = nowy kod odpowiada przez Caddy, nie „print('Health OK')"
            # w kontenerze, który zawsze przechodził.
            for i in $(seq 1 12); do
              if curl -sf -o /dev/null "https://api.rybnolive.pl/api/articles?limit=1"; then
                echo "API odpowiada (próba $i)"
                exit 0
              fi
              sleep 5
            done
            echo "::error::API nie odpowiedziało w 60 s po wdrożeniu"
            docker compose -f docker-compose.prod.yml logs backend --tail 30
            exit 1
