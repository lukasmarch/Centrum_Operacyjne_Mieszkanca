name: Deploy Backend

# ⚠️ Zielony job NIE był dowodem wdrożenia (2 i 3.09.2026): `git pull` padał
# (GitHub limituje anonimowe pobrania z IP serwera), a skrypt bez `set -e` szedł
# dalej — budował obraz ze STAREGO kodu z warstw cache, health check drukował
# „Health OK" i job kończył się sukcesem. Dziś: serwer ciągnie repo kluczem
# deploy (read-only, `core.sshCommand` w repo), skrypt przerywa na pierwszym
# błędzie, a po pullu porównuje SHA z tym, który wywołał workflow.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy.yml'

jobs:
  # Bramka przed deployem (audyt 11.10.2026, F-031). Do tej pory push szedł na
  # produkcję bez uruchomienia ANI JEDNEGO testu — strażnik nagłówka briefingu
  # był zepsuty od 9.10 i nikt się o tym nie dowiedział.
  # Tylko testy bez bazy i bez modelu: schematu produkcji nie da się zbudować
  # z modeli (ręczne migracje, F-034), a model kosztuje. Sekrety poniżej to
  # atrapy wymaganych pól konfiguracji — żaden test nie może dzięki nim wyjść
  # do sieci (OpenAI odpowie 401, baza na porcie 1 odmówi połączenia).
  # Nowy test bez bazy i modelu → dopisz go do listy.
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/brak
      OPENAI_API_KEY: sk-ci-atrapa
      OPENWEATHER_API_KEY: ci-atrapa
      JWT_SECRET: ci-atrapa-ci-atrapa-ci-atrapa-ci-atrapa
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Testy bez bazy i modelu
        run: |
          set -u
          failed=""
          for t in \
            test_access_control:--no-db \
            test_agent_tools test_alert_policy test_bip_knowledge test_content_gate \
            test_content_score test_council_sessions test_council_store test_council_summary \
            test_event_dedup test_event_gate test_event_phase test_event_terms test_feed_dedup test_feed_window \
            test_gmina_facts test_grounding test_job_runs test_legal_acts test_migration_registry test_newsletter_tense test_outage_outlook test_password_reset \
            test_provenance test_road_context test_schema_contract test_source_health test_storm_policy test_story_judge test_summary_context \
            test_summary_headline test_text_clean test_timezone_guard
          do
            name="${t%%:*}"; args=""; [ "$name" != "$t" ] && args="${t#*:}"
            echo "::group::$name $args"
            if python -u -m "scripts.$name" $args </dev/null; then echo "OK $name"; else failed="$failed $name"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Czerwone:$failed"; exit 1; fi

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/centrum

            git fetch origin main
            git merge --ff-only origin/main
            DEPLOYED="$(git rev-parse HEAD)"
            if [ "$DEPLOYED" != "${{ github.sha }}" ]; then
              echo "::error::Po pullu HEAD=$DEPLOYED, a workflow wywołał ${{ github.sha }} — repo na serwerze nie nadążyło"
              exit 1
            fi
            echo "Kod na serwerze: $DEPLOYED"

            docker compose -f docker-compose.prod.yml build backend

            # Osierocony kontener po nieudanym `up` blokuje nazwę (3.09.2026,
            # dwa razy): sprzątamy zatrzymane, zanim postawimy nowy.
            docker ps -aq -f name=centrum-backend -f status=exited | xargs -r docker rm -f
            docker compose -f docker-compose.prod.yml up -d backend

            # Zdrowie = nowy kod odpowiada przez Caddy, nie „print('Health OK')"
            # w kontenerze, który zawsze przechodził.
            for i in $(seq 1 12); do
              if curl -sf -o /dev/null "https://api.rybnolive.pl/api/articles?limit=1"; then
                echo "API odpowiada (próba $i)"
                exit 0
              fi
              sleep 5
            done
            echo "::error::API nie odpowiedziało w 60 s po wdrożeniu"
            docker compose -f docker-compose.prod.yml logs backend --tail 30
            exit 1
