name: Frontend check

# Kontrola typów frontu (audyt 11.10.2026, etap C10). Do tego dnia `tsc` zgłaszał
# 13 błędów, których nikt nie widział, bo build Vite typów NIE sprawdza.
# Workflow niczego nie wdraża — front idzie na produkcję ręcznie
# (`deploy-frontend.sh`, po akceptacji zrzutów). Czerwony job = nie wdrażaj.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-check.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
